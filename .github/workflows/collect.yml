name: collect
# Builds the claim -> citation dataset from public USPTO data and stores it in the private
# Hugging Face dataset. Each run works ~5h20m, saves progress, and starts the next run itself.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = check the API key and real file formats; run = build"
        default: run
        type: choice
        options: [run, test]
  schedule:
    - cron: "41 */6 * * *"   # safety net: restarts the chain if a run ever fails to hand off
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: pip install -q "huggingface_hub>=0.24"
      - name: Test
        if: ${{ github.event.inputs.mode == 'test' }}
        env:
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "import cloud; s=cloud.HFStore(); print('Hugging Face dataset OK:', s.repo)"
          python -c "import os,collector as C; os.makedirs(C.WORK,exist_ok=True); C.cmd_test(C.curl_config(os.environ['USPTO_API_KEY']))"
      - name: Build
        id: build
        if: ${{ github.event.inputs.mode != 'test' }}
        env:
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PM_BUDGET_MIN: "320"
        run: python cloud.py
      - name: Start the next run
        if: ${{ steps.build.outputs.result == 'continue' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" -f mode=run
